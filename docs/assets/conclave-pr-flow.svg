<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Conclave PR flow</title>
  <desc id="desc">A code change is compared by Conclave, enriched with context and evidence, reviewed by a human, and then the pull request can move to merge.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e293b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker></defs>
  <rect width="1400" height="320" rx="24" fill="url(#bg)"/>
  <text x="54" y="54" fill="#f8fafc" font-family="Arial,sans-serif" font-size="26" font-weight="700">From code change to a safer PR</text>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">
    <g transform="translate(45 105)"><rect width="205" height="125" rx="16" fill="#2563eb"/><text x="102" y="45" text-anchor="middle" fill="white" font-weight="700">1 · Code change</text><text x="102" y="73" text-anchor="middle" fill="#dbeafe">branch commits + every</text><text x="102" y="95" text-anchor="middle" fill="#dbeafe">local workspace file</text></g>
    <g transform="translate(285 105)"><rect width="225" height="125" rx="16" fill="#0f766e"/><text x="112" y="45" text-anchor="middle" fill="white" font-weight="700">2 · Conclave review</text><text x="112" y="73" text-anchor="middle" fill="#ccfbf1">diff, code units, impact,</text><text x="112" y="95" text-anchor="middle" fill="#ccfbf1">findings and evidence</text></g>
    <g transform="translate(545 105)"><rect width="235" height="125" rx="16" fill="#7c3aed"/><text x="117" y="45" text-anchor="middle" fill="white" font-weight="700">3 · Agent correction</text><text x="117" y="73" text-anchor="middle" fill="#ede9fe">copy the handoff, fix,</text><text x="117" y="95" text-anchor="middle" fill="#ede9fe">then review again</text></g>
    <g transform="translate(815 105)"><rect width="245" height="125" rx="16" fill="#d97706"/><text x="122" y="45" text-anchor="middle" fill="white" font-weight="700">4 · Human approval</text><text x="122" y="73" text-anchor="middle" fill="#fef3c7">reviewer checks evidence</text><text x="122" y="95" text-anchor="middle" fill="#fef3c7">and makes the decision</text></g>
    <g transform="translate(1095 105)"><rect width="245" height="125" rx="16" fill="#16a34a"/><text x="122" y="45" text-anchor="middle" fill="white" font-weight="700">5 · Merge when ready</text><text x="122" y="73" text-anchor="middle" fill="#dcfce7">the PR moves only after</text><text x="122" y="95" text-anchor="middle" fill="#dcfce7">human approval</text></g>
  </g>
  <path d="M250 167h30M510 167h30M780 167h30M1060 167h30" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
