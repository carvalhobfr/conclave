<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Conclave PR flow</title>
  <desc id="desc">A code change is checked locally by Conclave, produces evidence, and then goes to human approval.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e293b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker></defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="54" y="54" fill="#f8fafc" font-family="Arial,sans-serif" font-size="26" font-weight="700">From code change to a safer PR</text>
  <g font-family="Arial,sans-serif" font-size="16">
    <g transform="translate(55 105)"><rect width="190" height="110" rx="16" fill="#2563eb"/><text x="95" y="45" text-anchor="middle" fill="white" font-weight="700">1 · Change</text><text x="95" y="72" text-anchor="middle" fill="#dbeafe">working tree, staged,</text><text x="95" y="93" text-anchor="middle" fill="#dbeafe">branch or commit</text></g>
    <g transform="translate(290 105)"><rect width="230" height="110" rx="16" fill="#0f766e"/><text x="115" y="45" text-anchor="middle" fill="white" font-weight="700">2 · Conclave checks</text><text x="115" y="72" text-anchor="middle" fill="#ccfbf1">diff, code units,</text><text x="115" y="93" text-anchor="middle" fill="#ccfbf1">impact and claims</text></g>
    <g transform="translate(565 105)"><rect width="230" height="110" rx="16" fill="#7c3aed"/><text x="115" y="45" text-anchor="middle" fill="white" font-weight="700">3 · Evidence</text><text x="115" y="72" text-anchor="middle" fill="#ede9fe">files, lines, graph</text><text x="115" y="93" text-anchor="middle" fill="#ede9fe">and next actions</text></g>
    <g transform="translate(840 105)"><rect width="300" height="110" rx="16" fill="#d97706"/><text x="150" y="45" text-anchor="middle" fill="white" font-weight="700">4 · Human approval</text><text x="150" y="72" text-anchor="middle" fill="#fef3c7">reviewer understands the</text><text x="150" y="93" text-anchor="middle" fill="#fef3c7">change before merge</text></g>
  </g>
  <path d="M245 160h40M520 160h40M795 160h40" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
