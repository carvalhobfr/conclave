name: verify

on:
  pull_request:
  push:
    branches:
      - master
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Dogfood Conclave against this change
        run: >-
          node dist/cli.js review . --branch origin/master
          --contract examples/self-validation-contract.json --json
