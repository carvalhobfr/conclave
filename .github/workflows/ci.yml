name: verify

on:
  pull_request:
  push:
    branches:
      - master
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercises the portable checks on the oldest supported runtime and on Windows, where the
  # Git and path-separator handling in the change-set collector would otherwise never run.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Built before the suites so the CLI end-to-end smoke test has a bundle to run.
      - run: npm run build
      - run: npm test
      # jsdom 30 pulls undici 8, which calls worker_threads.markAsUncloneable — a Node 22 API.
      # The product itself runs on Node 20; only this browser-environment test tooling does not.
      - run: npm run test:web
        if: matrix.node != 20

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Resolve validation base
        id: validation-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            validation_base="origin/$BASE_REF"
            validation_head="${{ github.event.pull_request.head.sha }}"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            validation_base="$BEFORE_SHA"
            validation_head="${{ github.sha }}"
          else
            validation_base="$(git merge-base HEAD origin/master)"
            validation_head="${{ github.sha }}"
          fi

          git rev-parse --verify "${validation_base}^{commit}"
          git rev-parse --verify "${validation_head}^{commit}"
          echo "ref=$validation_base" >> "$GITHUB_OUTPUT"
          echo "head=$validation_head" >> "$GITHUB_OUTPUT"
      - name: Dogfood Conclave against this change
        env:
          CONCLAVE_BASE: ${{ steps.validation-base.outputs.ref }}
          CONCLAVE_HEAD: ${{ steps.validation-base.outputs.head }}
        run: >-
          node dist/cli.js review . --base "$CONCLAVE_BASE" --head "$CONCLAVE_HEAD"
          --objective "Keep the Conclave validator and its agent integration correct"
          --contract examples/self-validation-contract.json --json
      - name: Dogfood portable agent skill
        env:
          CONCLAVE_BASE: ${{ steps.validation-base.outputs.ref }}
          CONCLAVE_HEAD: ${{ steps.validation-base.outputs.head }}
        run: >-
          node skills/conclave-validate/scripts/run-validation.mjs
          --repository . --source branch --ref "$CONCLAVE_BASE" --head "$CONCLAVE_HEAD"
          --objective "Ship a portable, verdict-preserving agent integration"
          --contract examples/self-validation-contract.json
          --output /tmp/conclave-agent-skill-report.json
